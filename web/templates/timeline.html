<section class="panel" id="timeline-panel">
    <div class="panel-heading"><h2>Timeline</h2><span id="timeline-status" role="status"></span></div>
    <p>Grüne Balken zeigen aus Scans abgeleitete Online-Zeiträume. Messlücken werden nicht als Offline-Zeiten dargestellt. Port- und Serviceinformationen stammen aus gespeicherten Beobachtungen; Zeiten in der lokalen Browser-Zeitzone.</p>
    <div class="toolbar">
        <button id="timeline-prev" type="button" disabled>Vorheriger Tag</button>
        <div><label for="timeline-day">Kalendertag</label><input id="timeline-day" type="date"></div>
        <button id="timeline-next" type="button" disabled>Nächster Tag</button>
    </div>
    <div id="timeline-content"></div>
</section>
