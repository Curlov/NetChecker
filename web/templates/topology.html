<section class="panel" id="topology-panel">
    <div class="panel-heading"><h2>Netzwerktopologie</h2><span id="topology-status"></span></div>
    <div class="toolbar">
        <button id="topology-reset" type="button">Ansicht zentrieren</button>
        <span id="topology-save-status" class="topology-save-status" role="status" aria-live="polite">Layout noch nicht geladen</span>
    </div>
    <div id="topology-palette" class="topology-palette" role="toolbar" aria-label="Objektpalette">
        <button id="topology-room-tool" class="topology-palette-item" type="button" aria-pressed="false" title="Rechteckige Räume auf dem Raster zeichnen">
            <span class="topology-palette-icon topology-palette-room-icon" aria-hidden="true">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3h18v18H3zM3 10h10v11M13 10h8"/>
                </svg>
            </span><span>Raum zeichnen</span>
        </button>
    </div>
    <section id="topology-unplaced" class="topology-unplaced" aria-label="Nicht platzierte Geräte">
        <div class="topology-unplaced-heading">
            <button id="topology-unplaced-toggle" class="topology-unplaced-toggle" type="button"
                aria-expanded="true" aria-controls="topology-unplaced-content">Nicht platzierte Geräte (0)</button>
            <label class="topology-unplaced-search-label" for="topology-unplaced-search">Suche</label>
            <input id="topology-unplaced-search" class="topology-unplaced-search" type="search"
                placeholder="IP, Name, Typ, Port oder Dienst" autocomplete="off" aria-label="Nicht platzierte Geräte suchen">
        </div>
        <div id="topology-unplaced-content" class="topology-unplaced-content">
            <div id="topology-unplaced-list" class="topology-unplaced-list" role="list"
                aria-label="Nicht platzierte Geräte"></div>
            <p id="topology-unplaced-empty" class="topology-unplaced-empty" hidden></p>
        </div>
    </section>
    <div class="topology-viewport" role="region" aria-label="Interaktive Netzwerktopologie" tabindex="0">
        <svg id="topology-graph" role="img" aria-label="Topologie der gespeicherten Netzwerkbeobachtungen" viewBox="0 0 1000 500"></svg>
    </div>
    <pre id="topology-evidence" tabindex="0"></pre>
    <div id="topology-context-menu" class="topology-context-menu" role="dialog" aria-label="Objektaktionen" hidden></div>
</section>
